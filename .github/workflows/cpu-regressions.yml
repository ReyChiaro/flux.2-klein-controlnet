name: CPU native contract regressions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: "-1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.1+cpu torchvision==0.24.1+cpu
          python -m pip install diffusers==0.37.1 transformers==5.16.1 accelerate==1.15.0 safetensors==0.8.0 numpy==2.2.6 Pillow==12.3.0 huggingface-hub==1.15.0
          python -m pip check
      - name: Verify CPU-only PyTorch and report versions
        run: |
          python -c "import torch; assert torch.version.cuda is None, torch.__version__; assert not torch.cuda.is_available(); print('CPU-only PyTorch:', torch.__version__)"
          python -m pip freeze
      - name: Run all CPU regressions
        run: python -B -u -m unittest discover -s tests -p 'test_*.py' -v
